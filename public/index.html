<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Letter Sounds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="letters-bg">
  <div class="rainbow-bar" aria-hidden="true"></div>
  <main id="app">
    <!-- Start: student types their name -->
    <section id="screen-start" class="screen">
      <h1 class="title" id="title" aria-label="Letter Sounds"></h1>
      <div class="owl-row">
        <div class="owl" aria-hidden="true">🦉</div>
        <div class="bubble"><p class="bubble-main">Hi! I'm Ollie the Owl.</p><p>Let's learn letters and earn stars!</p></div>
      </div>
      <form id="start-form" class="card stack">
        <label class="field">First name
          <input id="first-name" autocomplete="off" maxlength="40" required>
        </label>
        <label class="field">Last name
          <input id="last-name" autocomplete="off" maxlength="40" required>
        </label>
        <div class="field-row">
          <label class="field">Grade
            <select id="grade" required>
              <option value="" disabled selected>Choose</option>
              <option value="Pre-K">Pre-K</option>
              <option value="K">Kindergarten</option>
              <option value="1">1st grade</option>
              <option value="2">2nd grade</option>
              <option value="3">3rd grade</option>
              <option value="4">4th grade</option>
              <option value="5">5th grade</option>
            </select>
          </label>
          <label class="field">Date of test
            <input id="test-date" type="date" required>
          </label>
        </div>
        <label class="field inline">How many letters?
          <select id="letter-count">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="26">All 26</option>
          </select>
        </label>
        <button type="submit" class="big-btn go">Let's go! ➜</button>
      </form>
      <p class="small teacher-link"><a href="teacher">Teacher page</a></p>
    </section>

    <!-- Welcome: the student's star chart -->
    <section id="screen-welcome" class="screen" hidden>
      <div class="owl-row">
        <div class="owl" aria-hidden="true">🦉</div>
        <div class="bubble"><p class="bubble-main" id="welcome-hello"></p><p id="welcome-stars"></p></div>
      </div>
      <div class="card chart-card">
        <h2>⭐ My Star Chart</h2>
        <p class="small">First star: letter name. Second star: letter sound.</p>
        <div class="star-chart" id="welcome-chart"></div>
      </div>
      <button id="begin-btn" class="big-btn go" type="button">Start ▶</button>
    </section>

    <!-- Letter test -->
    <section id="screen-letter" class="screen" hidden>
      <div class="topbar">
        <span class="pill" id="who"></span>
        <div class="progress" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="pill star-pill" id="star-count" aria-label="Stars">⭐ 0</span>
      </div>
      <div class="letter-card" id="letter-card"><span id="letter-upper"></span><span id="letter-lower"></span></div>
      <div class="owl-row">
        <div class="owl" id="owl" aria-hidden="true">🦉</div>
        <div class="bubble">
          <p class="bubble-main" id="prompt"></p>
          <p class="feedback" id="feedback" aria-live="polite"></p>
        </div>
      </div>
      <div class="steps">
        <span class="step" id="step-name">Name</span>
        <span class="step" id="step-sound">Sound</span>
      </div>
      <button id="say-btn" class="say-btn" type="button">🎤 Say it</button>
      <div id="teacher-check" class="teacher-check" hidden>
        <p class="small" id="teacher-reason"></p>
        <p class="teacher-q" id="teacher-question"></p>
        <div class="row">
          <button type="button" class="big-btn ok" id="teacher-yes">✓ Correct</button>
          <button type="button" class="big-btn no" id="teacher-no">✗ Not correct</button>
        </div>
        <button type="button" class="big-btn" id="teacher-later">Continue ➜ <span class="small-label">(teacher will listen later)</span></button>
      </div>
    </section>

    <!-- Record a video after a miss -->
    <section id="screen-record" class="screen" hidden>
      <div class="owl-row">
        <div class="owl" aria-hidden="true">🦉</div>
        <div class="bubble"><p class="bubble-main">Let's record you!</p><p id="record-prompt"></p></div>
      </div>
      <video id="camera" class="camera live" autoplay muted playsinline></video>
      <p class="countdown" id="countdown" aria-live="polite"></p>
      <button id="record-btn" class="big-btn" type="button">🔴 Start recording</button>
      <p class="feedback" id="record-status" aria-live="polite"></p>
    </section>

    <!-- Practice activities -->
    <section id="screen-practice" class="screen" hidden>
      <div class="topbar">
        <span class="pill">Practice <strong id="practice-letter"></strong></span>
        <span class="pill" id="practice-step"></span>
      </div>
      <div id="activity" class="card activity"></div>
    </section>

    <!-- Done -->
    <section id="screen-done" class="screen" hidden>
      <h1 class="done-title">🎉 Great job!</h1>
      <div class="owl-row">
        <div class="owl" aria-hidden="true">🦉</div>
        <div class="bubble"><p class="bubble-main" id="done-summary"></p><p id="done-stars"></p></div>
      </div>
      <div class="card chart-card">
        <h2>⭐ My Star Chart</h2>
        <p class="small">First star: letter name. Second star: letter sound.</p>
        <div class="star-chart" id="done-chart"></div>
      </div>
      <div class="row">
        <button id="again-btn" class="big-btn go" type="button">Play again ↻</button>
        <button id="switch-btn" class="big-btn" type="button">New student</button>
      </div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
